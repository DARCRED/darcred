<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARCRED</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at 20% 20%, rgba(212,175,55,0.15), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(139,94,60,0.2), transparent 40%),
#050505;
overflow:hidden;
}

/* CARD */
.container{
width:420px;
padding:50px 40px;
border-radius:24px;
background:rgba(20,15,10,0.6);
backdrop-filter:blur(25px);
border:1px solid rgba(212,175,55,0.15);
box-shadow:
0 0 60px rgba(0,0,0,0.9),
0 0 40px rgba(212,175,55,0.08);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1;}
}

/* LOGO */
.logo{
font-family:'Playfair Display',serif;
font-size:34px;
color:#f5e6d0;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#bfa98a;
margin-bottom:35px;
font-size:14px;
}

/* INPUT */
.input{
position:relative;
margin-bottom:25px;
}

.input input{
width:100%;
padding:16px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.08);
background:transparent;
color:#fff;
outline:none;
transition:0.3s;
}

.input input:focus{
border-color:#d4af37;
box-shadow:0 0 12px rgba(212,175,55,0.4);
}

.input label{
position:absolute;
top:50%;
left:14px;
transform:translateY(-50%);
color:#8c7a63;
transition:0.3s;
}

.input input:focus + label,
.input input:valid + label{
top:-8px;
font-size:12px;
background:#050505;
padding:0 6px;
color:#d4af37;
}

/* BUTTON */
.btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#d4af37,#f5e6c8);
color:#000;
font-weight:600;
cursor:pointer;
transition:0.3s;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
box-shadow:0 5px 20px rgba(212,175,55,0.4);
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 8px 30px rgba(212,175,55,0.6);
}

/* LOADING */
.spinner{
width:18px;
height:18px;
border:2px solid #000;
border-top:2px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
display:none;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* ERROR */
.error{
color:#ff6b6b;
text-align:center;
margin-top:15px;
display:none;
}

/* MOBILE */
@media(max-width:500px){
.container{
width:90%;
padding:30px 25px;
}

.logo{
font-size:26px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">DARCRED</div>
<div class="subtitle">A Recovery Firm You Can Trust</div>

<div class="input">
<input type="text" id="user" required>
<label>Email</label>
</div>

<div class="input">
<input type="password" id="pass" required>
<label>Password</label>
</div>

<button class="btn" onclick="login()">
<span id="btnText">Login</span>
<div class="spinner" id="spinner"></div>
</button>

<div class="error" id="errorMsg">Invalid credentials</div>

</div>

<script>
function login(){
let user=document.getElementById("user").value.trim();
let pass=document.getElementById("pass").value.trim();

const spinner = document.getElementById("spinner");
const btnText = document.getElementById("btnText");
const errorMsg = document.getElementById("errorMsg");

errorMsg.style.display="none";

// simple validation
if(user === "" || pass === ""){
errorMsg.innerText = "Please fill in all fields";
errorMsg.style.display="block";
return;
}

spinner.style.display="block";
btnText.innerText="Verifying...";

setTimeout(()=>{

// YOUR LOGIN DETAILS
if(user === "johnmiller@gmail.com" && pass === "998998"){
localStorage.setItem("loggedIn","true");
window.location.href="dashboard.html";
}else{
errorMsg.innerText="Invalid credentials";
errorMsg.style.display="block";
spinner.style.display="none";
btnText.innerText="Login";
}

},1000);
}

// ENTER KEY SUPPORT
document.addEventListener("keydown", function(e){
if(e.key === "Enter"){
login();
}
});
</script>

</body>
</html>
