<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARCRED</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */
body {
    background:
    radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(139,94,60,0.12), transparent 40%),
    #050505;
    font-family: 'Inter', sans-serif;
    color: #f5e6d0;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    height: 100vh;
    position: fixed;
    background: rgba(15,10,5,0.95);
    border-right: 1px solid rgba(212,175,55,0.08);
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.3s ease;
}

.logo {
    font-family:'Playfair Display',serif;
    font-size: 22px;
    color: #f5e6d0;
    margin-bottom: 40px;
}

.nav-link {
    color: #bfa98a;
    font-size: 14px;
    margin-bottom: 15px;
}
.nav-link:hover { color: #d4af37; }

.nav-link.active {
    color: #d4af37;
    font-weight: 600;
}

/* LOGOUT */
.logout-btn {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(212,175,55,0.1);
    color: #ff6b6b;
    cursor: pointer;
    font-size: 14px;
}
.logout-btn:hover {
    color: #ff4d4d;
}

/* MAIN */
.main {
    margin-left: 260px;
    padding: 40px;
}

/* HEADER */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.account-name {
    font-size: 34px;
    font-weight: 600;
}

.account-type {
    font-size: 13px;
    color: #bfa98a;
}

.profile-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,175,55,0.08);
    padding: 8px 12px;
    border-radius: 12px;
}

.balance {
    font-size: 48px;
    font-weight: 700;
    margin-top: 25px;
}

.balance-label {
    color: #bfa98a;
}

.card-box {
    background: rgba(20,15,10,0.6);
    border: 1px solid rgba(212,175,55,0.08);
    border-radius: 18px;
    padding: 20px;
}

.card-title { color: #bfa98a; }
.card-value { font-size: 26px; }

.green { color: #d4af37; }
.blue { color: #c8a97e; }

.btn-action { border-radius: 14px; padding: 14px; }

.btn-deposit {
    background: linear-gradient(135deg,#d4af37,#f5e6c8);
    color: #000;
}

.btn-withdraw {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.2);
    color: #f5e6d0;
}

.transaction {
    background: rgba(20,15,10,0.6);
    border: 1px solid rgba(212,175,55,0.08);
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 10px;
}

/* OVERLAY */
.overlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);
    display:none;
    z-index:999;
}

/* MOBILE */
@media (max-width: 992px){

.sidebar{
left:-260px;
z-index:1000;
}

.sidebar.active{
left:0;
}

.overlay.active{
display:block;
}

.main{
margin-left:0;
padding:20px;
}

.top-bar{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

.balance{
font-size:32px;
}

}

@media (max-width:576px){

.account-name{font-size:22px;}
.balance{font-size:26px;}
.card-value{font-size:20px;}

.d-flex.gap-3.mt-4{
flex-direction:column;
}

}
</style>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" onclick="closeSidebar()"></div>

<div class="sidebar">
<div>
    <div class="logo">DARCRED</div>
    <a class="nav-link active">Dashboard</a>
    <a class="nav-link">Wallet</a>
    <a class="nav-link">Investments</a>
    <a class="nav-link">Transactions</a>
    <a class="nav-link">Settings</a>
</div>

<div class="logout-btn" onclick="logout()">Logout</div>
</div>

<div class="main">

<div class="top-bar">
<button class="btn btn-outline-light d-lg-none" onclick="toggleSidebar()">
<i class="bi bi-list"></i>
</button>

<div>
<div class="account-name">John Miller</div>
<div class="account-type">Primary Recovery Account</div>
</div>
</div>

<div class="balance" id="balance">$0.00</div>
<div class="balance-label">Total Balance</div>

<div class="row mt-4 g-4">
<div class="col-md-4">
<div class="card-box">
<div class="card-title">Actual Deposit</div>
<div class="card-value" id="investment">$0.00</div>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="card-title">Interest</div>
<div class="card-value green" id="profit">$0.00</div>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="card-title">Withdrawable</div>
<div class="card-value blue" id="withdrawable">$0.00</div>
</div>
</div>
</div>

<div class="d-flex gap-3 mt-4">
<button class="btn-action btn-deposit w-100" onclick="openModal('deposit')">Deposit Funds</button>
<button class="btn-action btn-withdraw w-100" onclick="openModal('withdraw')">Withdraw Funds</button>
</div>

<div class="mt-5">
<h5>Recent Activity</h5>
<div id="transactions"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// SIDEBAR CONTROL
function toggleSidebar(){
document.querySelector(".sidebar").classList.toggle("active");
document.querySelector(".overlay").classList.toggle("active");
}

function closeSidebar(){
document.querySelector(".sidebar").classList.remove("active");
document.querySelector(".overlay").classList.remove("active");
}

// LOGOUT
function logout(){
localStorage.removeItem("loggedIn");
window.location.href = "login.html";
}

// DATA
let deposit = 228000;
let interest = 79000;
let total = deposit + interest;

function animate(id, end){
let start = 0;
let duration = 1200;
let startTime = null;

function step(t){
if(!startTime) startTime = t;
let progress = t - startTime;
let value = Math.min(Math.floor((progress/duration)*end), end);

document.getElementById(id).innerText = "$" + value.toLocaleString();

if(progress < duration){
requestAnimationFrame(step);
}
}
requestAnimationFrame(step);
}

window.onload = function(){
animate("investment", deposit);
animate("profit", interest);
animate("withdrawable", total);
animate("balance", total);

document.getElementById("transactions").innerHTML = `
<div class="transaction d-flex justify-content-between">
<div>Deposit</div>
<div class="green">+$${total.toLocaleString()}</div>
</div>
`;
};

// MODAL
function openModal(type){
const body = document.getElementById("modalBody");
const title = document.getElementById("modalTitle");

if(type === "deposit"){
title.innerText = "Deposit Funds";
body.innerHTML = `
<input class="form-control mb-3" placeholder="Amount">
<input class="form-control mb-3" placeholder="Card Holder Name">
<input class="form-control mb-3" placeholder="Card Number">
<div class="row">
<div class="col-6"><input class="form-control mb-3" placeholder="MM/YY"></div>
<div class="col-6"><input class="form-control mb-3" placeholder="CVV"></div>
</div>`;
}

if(type === "withdraw"){
title.innerText = "Withdrawal";
body.innerHTML = `<p class="text-center">Proceed to pay a recovery fee of <strong>$61,400</strong>.</p>`;
}

new bootstrap.Modal(document.getElementById("actionModal")).show();
}
</script>

<!-- MODAL -->
<div class="modal fade" id="actionModal">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content bg-dark text-white">
<div class="modal-header border-0">
<h5 id="modalTitle"></h5>
<button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="modalBody"></div>
</div>
</div>
</div>

</body>
</html>
